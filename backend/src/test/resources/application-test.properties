spring.application.name=backend-test

# H2 Database for tests
spring.datasource.url=jdbc:h2:mem:meubolso_test;DB_CLOSE_DELAY=-1;MODE=Oracle;INIT=CREATE SCHEMA IF NOT EXISTS meubolso
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JWT Config for tests
jwt.secret=MeuBolsoEnterpriseSecretKeyParaAssinaturaDeTokensMultiTenant
jwt.expiration=86400000
